[project]
name = "symbolic_math_toolkit"
version = "0.1.0"
description = "Explainable symbolic-numeric workflows for equations, optimization, dynamical systems, and research mathematics."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
